{{- if .Values.connector.enabled -}}
{{- $watched := include "garam-connector.watched" . | fromJsonArray -}}
{{- $selector := dict "root" . "program" "connector" -}}
{{- $c := .Values.connector -}}
{{- $garam := include "garam-connector.garamOn" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-connector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garam-connector.labels" . | nindent 4 }}
{{- if $garam }}
---
# The cluster's key and record, which the connector writes and nothing else does. The chart creates
# it empty and never writes its data, so an upgrade keeps the key (ADR 0088, ADR 0093).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garam-connector.identitySecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garam-connector.labels" . | nindent 4 }}
type: Opaque
{{- end }}
{{- if $c.naru.enabled }}
---
# The naru caller's key and certificate, which the connector writes and nothing else does. The chart
# creates it empty and never writes its data, so an upgrade keeps the pair (garam-bot#1209).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garam-connector.naruCallerSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garam-connector.labels" . | nindent 4 }}
type: Opaque
{{- end }}
---
# The connector's serving certificates, which it publishes under ca.crt and the manager copies to each
# Bot. The chart creates it empty (ADR 0097).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "garam-connector.trustConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garam-connector.labels" . | nindent 4 }}
---
# One replica, and Recreate, so no two connectors run at once with two spent sets (ADR 0097
# decision 6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-connector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garam-connector.labels" . | nindent 4 }}
    {{- include "garam-connector.selector" $selector | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garam-connector.selector" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garam-connector.selector" $selector | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-connector
      securityContext:
        {{- include "garam-connector.podSecurity" . | nindent 8 }}
      containers:
        - name: connector
          image: {{ include "garam-connector.image" (dict "name" "connector" "ref" .Values.images.connector) }}
          imagePullPolicy: Always
          args:
            {{- if $garam }}
            - --garam-url={{ $c.garamURL }}
            - --garam-root-file=/etc/garam-connector/garam-root/{{ $c.garamRoot.key }}
            - --registration-token-file=/etc/garam-connector/registration/{{ $c.registrationToken.key }}
            - --report-only={{ $c.reportOnly }}
            - --rotation-period={{ $c.rotationPeriod }}
            - --identity-secret={{ include "garam-connector.identitySecret" . }}
            {{- end }}
            - --release-namespace={{ .Release.Namespace }}
            - --release-name={{ .Release.Name }}
            - --watch-namespaces={{ join "," $watched }}
            - --bot-token-address=:{{ include "garam-connector.botTokenPort" . }}
            - --bot-token-service={{ include "garam-connector.serviceName" . }}
            - --bot-token-audience={{ include "garam-connector.audience" . }}
            - --trust-configmap={{ include "garam-connector.trustConfigMap" . }}
            {{- with $c.naru }}
            {{- if .enabled }}
            - --naru-url={{ required "connector.naru.url is required where connector.naru is enabled" .url }}
            - --naru-root-file=/etc/garam-connector/naru-root/{{ .root.key }}
            - --naru-registration-token-file=/etc/garam-connector/naru-registration/{{ .registrationToken.key }}
            - --naru-caller-secret={{ include "garam-connector.naruCallerSecret" $ }}
            - --naru-proxy-address={{ required "connector.naru.proxyAddress is required where connector.naru is enabled" .proxyAddress }}
            {{- if .proxyRoot.configMap }}
            - --naru-proxy-root-file=/etc/garam-connector/naru-proxy-root/{{ .proxyRoot.key }}
            {{- end }}
            {{- if not .rootDiskBytes }}
            {{- fail "connector.naru.rootDiskBytes is required where connector.naru is enabled" }}
            {{- end }}
            - --naru-root-disk-bytes={{ .rootDiskBytes | int64 }}
            - --connector-deployment={{ $.Release.Name }}-connector
            {{- end }}
            {{- end }}
            {{- if include "garam-connector.workspacesOn" . }}
            {{- with .Values.workspaces }}
            - --workspace-namespace={{ .namespace }}
            - --workspace-audience={{ include "garam-connector.workspaceAudience" $ }}
            {{- range $harness, $ref := $.Values.images.agents }}
            - --agent-image={{ $harness }}={{ include "garam-connector.image" (dict "name" (printf "agents.%s" $harness) "ref" $ref) }}
            {{- end }}
            - --workspace-helper-image={{ include "garam-connector.image" (dict "name" "workspaceHelper" "ref" $.Values.images.workspaceHelper) }}
            - --max-dials={{ .maxDials | int }}
            - --pod-workspace-enforces-egress={{ .pod.enforcesNetworkPolicy }}
            - --pod-model-gateway-url={{ required "workspaces.pod.modelGatewayURL is required where workspaces.namespace is set" .pod.modelGatewayURL }}
            - --pod-tool-proxy-url={{ required "workspaces.pod.toolProxyURL is required where workspaces.namespace is set" .pod.toolProxyURL }}
            - --pod-workspace-egress={{ include "garam-connector.workspaceEgress" (dict "name" "pod" "rules" .pod.egress) }}
            {{- if $.Values.connector.naru.enabled }}
            - --naru-model-gateway-url={{ required "workspaces.naru.modelGatewayURL is required where workspaces.namespace is set and connector.naru is enabled" .naru.modelGatewayURL }}
            - --naru-tool-proxy-url={{ required "workspaces.naru.toolProxyURL is required where workspaces.namespace is set and connector.naru is enabled" .naru.toolProxyURL }}
            - --naru-workspace-egress={{ include "garam-connector.workspaceEgress" (dict "name" "naru" "rules" .naru.egress) }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- if .Values.proxy.url }}
          env:
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.url | quote }}
            # The API server is reached directly, as the NetworkPolicy admits it.
            - name: NO_PROXY
              value: {{ printf "%s,.svc,.cluster.local" .Values.apiServer.cidr | quote }}
          {{- end }}
          ports:
            - name: bot-token
              containerPort: {{ include "garam-connector.botTokenPort" . }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- include "garam-connector.containerSecurity" . | nindent 12 }}
          {{- if or $garam $c.naru.enabled }}
          volumeMounts:
            {{- if $garam }}
            - name: garam-root
              mountPath: /etc/garam-connector/garam-root
              readOnly: true
            - name: registration
              mountPath: /etc/garam-connector/registration
              readOnly: true
            {{- end }}
            {{- if $c.naru.enabled }}
            - name: naru-root
              mountPath: /etc/garam-connector/naru-root
              readOnly: true
            - name: naru-registration
              mountPath: /etc/garam-connector/naru-registration
              readOnly: true
            {{- if $c.naru.proxyRoot.configMap }}
            - name: naru-proxy-root
              mountPath: /etc/garam-connector/naru-proxy-root
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or $garam $c.naru.enabled }}
      volumes:
        {{- if $garam }}
        - name: garam-root
          configMap:
            name: {{ $c.garamRoot.configMap }}
        # Read only while the cluster is not registered, so it may be deleted after.
        - name: registration
          secret:
            secretName: {{ $c.registrationToken.secret }}
            optional: true
        {{- end }}
        {{- if $c.naru.enabled }}
        - name: naru-root
          configMap:
            name: {{ required "connector.naru.root.configMap is required where connector.naru is enabled" $c.naru.root.configMap }}
        # Read only while the connector holds no caller certificate, so it may be deleted after.
        - name: naru-registration
          secret:
            secretName: {{ $c.naru.registrationToken.secret }}
            optional: true
        {{- if $c.naru.proxyRoot.configMap }}
        - name: naru-proxy-root
          configMap:
            name: {{ $c.naru.proxyRoot.configMap }}
        {{- end }}
        {{- end }}
      {{- end }}
---
# The bot token server, which the bots' processes of the watched namespaces reach (ADR 0097 decision 4).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garam-connector.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garam-connector.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "garam-connector.selector" $selector | nindent 4 }}
  ports:
    - name: bot-token
      port: {{ include "garam-connector.botTokenPort" . }}
      targetPort: bot-token
---
# The connector admits the bots' processes of the watched namespaces on its bot token port alone, and
# reaches garam where it is on, through the proxy where one is set, cluster DNS and the API server (ADR 0091 decision
# 4, ADR 0097 decision 4), and orch and naru-proxy where the naru Machine provider is on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-connector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garam-connector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "garam-connector.selector" $selector | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml $watched | nindent 18 }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: garam-bot
      ports:
        - protocol: TCP
          port: {{ include "garam-connector.botTokenPort" . }}
  egress:
    {{- if not $garam }}
    {{- else if .Values.proxy.url }}
    - to:
        - ipBlock:
            cidr: {{ required "proxy.cidr is required where proxy.url is set" .Values.proxy.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.proxy.port }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: {{ $c.garamEgressCIDR }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if $c.naru.enabled }}
    {{- if not $c.naru.egress }}
    {{- fail "connector.naru.egress is required where connector.naru is enabled" }}
    {{- end }}
    {{- range $c.naru.egress }}
    - to:
        - ipBlock:
            cidr: {{ required "each connector.naru.egress entry needs a cidr" .cidr }}
      ports:
        - protocol: TCP
          port: {{ required "each connector.naru.egress entry needs a port" .port }}
    {{- end }}
    {{- end }}
    {{- include "garam-connector.dnsEgress" . | nindent 4 }}
    {{- include "garam-connector.apiServerEgress" . | nindent 4 }}
{{- end }}
