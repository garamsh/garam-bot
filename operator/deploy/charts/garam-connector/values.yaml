# The connector chart's values (operator/docs/architecture/connector.md, ADR 0091). No value carries a
# secret: the registration token is read from a Secret you create, named here.

# watchNamespaces are the namespaces the manager runs Bots in and the connector applies garam's
# declarations to. Each must exist before install. The chart claims each one for this release with the
# Lease garam-connector-claim, and gives both programs a Role there. Empty watches the release
# namespace alone. Each program can read and write what its Role names in every watched namespace, so
# a watched namespace holds the bots' objects and nothing you would not hand these two programs.
watchNamespaces: []

# images are pinned by digest, as <repository>:<tag>@sha256:<digest>. The chart refuses another form.
images:
  # manager is garam-bot/operator-manager.
  manager: ""
  # connector is garam-bot/operator-connector.
  connector: ""
  # runtime is garam-bot/runtime, which every Bot's Pod runs.
  runtime: ""
  # workspaceHelper is the Pod provider's file helper, which every Pod workspace runs. Required where
  # workspaces.namespace is set.
  workspaceHelper: ""
  # agents are the workspace images, one per harness: a Bot's spec.agent.harness picks one, and a
  # harness with none is answered unsupported (ADR 0099 decision 8). For example
  # {claude-code: <repository>:<tag>@sha256:<digest>}.
  agents: {}

# apiServer is the address range and port the programs reach the Kubernetes API at, for their
# NetworkPolicies' egress. Where the API server lies is the distribution's, and no portable selector
# names it, so it is required.
apiServer:
  cidr: ""
  port: 443

# dns is cluster DNS, which the connector's egress admits.
dns:
  namespace: kube-system
  podSelector:
    k8s-app: kube-dns

connector:
  # enabled turns the connector off where false, leaving the manager alone: the standalone cluster
  # mode, which needs no garam connection.
  enabled: true
  # garamURL is the cluster-connection base URL garam serves, without /cluster-connection/v1alpha1.
  garamURL: ""
  # garamRoot is the ConfigMap holding the PEM root garam's certificate chains to, under key.
  garamRoot:
    configMap: ""
    key: ca.crt
  # garamEgressCIDR is the address range garam is reached at on 443 where no proxy is set.
  garamEgressCIDR: 0.0.0.0/0
  # registrationToken is the Secret you create holding the one-time registration token, under key.
  # It is read only while the cluster is not registered, and may be deleted after.
  registrationToken:
    secret: garam-connector-registration
    key: token
  # reportOnly applies and deletes nothing garam sends, and still reports (DECL-15).
  reportOnly: false
  # rotationPeriod is how long the cluster's key signs before the connector rotates it.
  rotationPeriod: 720h
  # naru runs interface 3's naru Machine provider in the connector, as the Machine API's caller of a
  # naru fleet (garam-bot#1209). Off by default.
  naru:
    enabled: false
    # url is orch's Machine API base URL, https, without /machines/v1alpha1.
    url: ""
    # root is the ConfigMap holding the PEM root orch's certificate chains to, under key.
    root:
      configMap: ""
      key: ca.crt
    # registrationToken is the Secret you create holding naru's one-time caller registration token,
    # under key. It is read only while the connector holds no caller certificate, and may be deleted
    # after.
    registrationToken:
      secret: garam-connector-naru-registration
      key: token
    # proxyAddress is naru-proxy's host:port, which a workspace's port is dialled through.
    proxyAddress: ""
    # proxyRoot is the ConfigMap holding the PEM root naru-proxy's certificate chains to, under key.
    # Empty, the image's system roots.
    proxyRoot:
      configMap: ""
      key: ca.crt
    # rootDiskBytes is the root disk of every workspace's Machine, in bytes.
    rootDiskBytes: 0
    # egress are the address ranges and ports the connector reaches orch and naru-proxy at:
    # a list of {cidr, port}.
    egress: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

manager:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# workspaces are the bots' workspaces, which the connector serves through interface 7 (ADR 0099). Off
# until namespace is set, and only where the connector is enabled.
workspaces:
  # namespace holds every workspace. The chart renders it, labelled for this release and enforcing
  # PodSecurity restricted, and gives the connector the Pod provider's rights there alone. It is never
  # the release namespace or a watched one. helm uninstall deletes it, and every workspace in it.
  namespace: ""
  # maxDials is the most dials open in all (DIAL-3).
  maxDials: 256
  # pod is the Pod provider, which runs every workspace as a Pod in namespace.
  pod:
    # enforcesNetworkPolicy says the cluster's network plugin enforces NetworkPolicy egress. Where it
    # is false, a workspace with egress rules is refused, and so every Pod workspace is.
    enforcesNetworkPolicy: true
    # modelGatewayURL and toolProxyURL are the model gateway and tool proxy a Pod workspace reaches.
    # Both are required.
    modelGatewayURL: ""
    toolProxyURL: ""
    # egress are the addresses a Pod workspace reaches: a list of {cidr, protocol, port, endPort},
    # protocol tcp or udp, endPort optional. They name Pod or host addresses after DNAT, never a
    # Service's address. The chart refuses a list without a rule to port 53.
    egress: []
  # naru is the naru Machine provider's workspaces, where connector.naru is enabled. A Machine runs
  # outside the cluster, so its URLs and egress are ones it reaches from there. All three are required
  # there, egress as pod.egress is, and refused where connector.naru is off.
  naru:
    modelGatewayURL: ""
    toolProxyURL: ""
    egress: []

# proxy is the forward proxy the connector reaches garam through. Where url is set, the connector's
# egress to garam goes to cidr:port alone.
proxy:
  url: ""
  cidr: ""
  port: 3128

# metrics are off. Where enabled, the manager serves plain HTTP metrics on port, admitted from the
# NetworkPolicy peers you name in from (ADR 0091 decision 4). The connector serves none.
metrics:
  enabled: false
  port: 8080
  from: []
