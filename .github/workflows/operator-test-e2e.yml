name: Operator e2e tests

# Runs only on the `dev` -> `main` promotion pull request, beside `Checks`. An author
# runs `make test-e2e` before a change reaches `dev`; CI runs it once per promotion
# rather than once per merge. No `push` trigger, for the reason `operator-checks.yml`
# gives (operator ADR 0028).
on:
  pull_request:
    branches: [main]
    # The operator's e2e tests, on the promotion when it carries a change to
    # operator/, to the api module the operator requires, or to this file.
    paths:
      - "operator/**"
      - "api/**"
      - ".github/workflows/operator-test-e2e.yml"

permissions: {}

# A newer push to the same pull request supersedes the run in progress, so
# only the latest head is checked. The release workflows keep none, for the
# reason operator-release.yml gives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: operator

env:
  # The role `make garam-e2e` pulls garam's test image from ECR as. Its name,
  # permissions and trust are garamsh/infra's (garamsh/infra#311, renamed under
  # garamsh/infra#450); this ARN was read back from IAM on 2026-10-16, after the
  # role was created.
  GARAM_TEST_PULL_ROLE: arn:aws:iam::486152169996:role/github-actions-garam-agent-operator-pull

jobs:
  test-e2e:
    permissions:
      contents: read
      # The federated credential `make garam-e2e` pulls garam's private test
      # image from ECR with, which it copies garam, its test-principal fixture
      # and its migrations out of (#271).
      id-token: write
    # infra's trust condition on the pull role names this environment. The OIDC
    # subject claim keys stay the repository default, because customizing them
    # would change the release tag's subject too. Renaming this repository or
    # this environment changes the subject, and the pull role then refuses it:
    # tell garamsh/infra before the rename, not after (garamsh/infra#311).
    environment: promotion-e2e
    name: operator e2e
    runs-on: ubuntu-24.04
    steps:
      # Dependabot moves the action pins below, rewriting the version comment with
      # the SHA (`.github/dependabot.yml`) — but only while the two already agree,
      # and only while the version is the last word on the line. `make verify-pins`
      # fails when either stops holding.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod

      # The ECR login `make garam-e2e` pulls with, as GARAM_TEST_PULL_ROLE.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.GARAM_TEST_PULL_ROLE }}
          aws-region: ap-northeast-2

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # `make test-e2e` installs kind itself, at the version the Makefile pins, so
      # this job holds no kind version of its own. helm/kind-action would put that
      # version and the cluster back here, where a contributor's command cannot
      # reach either.
      - name: Run the e2e tests
        run: make test-e2e
