name: Operator checks

# Runs only on the `dev` -> `main` promotion pull request: work lands on `dev`
# unchecked by CI, and its author's local `make ci` is the gate there. No `push`
# trigger, because the promotion merges without squashing and that merge is the tree
# this run already checked (operator ADR 0028).
on:
  pull_request:
    branches: [main]
    # The operator's checks, on the promotion when it carries a change to
    # operator/, to the api module the operator requires, or to this file.
    # ci.yml checks the root and api modules on the same pull request.
    paths:
      - "operator/**"
      - "api/**"
      - ".github/workflows/operator-checks.yml"

permissions: {}

# A newer push to the same pull request supersedes the run in progress, so
# only the latest head is checked. The release workflows keep none, for the
# reason operator-release.yml gives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: operator

jobs:
  checks:
    permissions:
      contents: read
    name: operator checks
    runs-on: ubuntu-24.04
    steps:
      # Dependabot moves the action pins below, rewriting the version comment with
      # the SHA (`.github/dependabot.yml`) — but only while the two already agree,
      # and only while the version is the last word on the line. `make verify-pins`
      # fails when either stops holding.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: operator/go.mod

      - name: Run the check set
        run: make ci

      # `git diff --exit-code` would miss a newly generated file, because an
      # untracked path is not a diff. The first `kubebuilder create api` writes
      # new manifests under config/crd/bases, so the check has to read status.
      - name: Verify generated and formatted output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after 'make ci' — generated or formatted output is not committed:"
            git status --porcelain
            exit 1
          fi
