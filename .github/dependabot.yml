# Moves the pins ci.md §Verify a pinned dependency requires a mover for:
# the base-image digests in build/*.Dockerfile and in the runtime
# fixture's deploy/runtime-fixture/meter/Dockerfile, the action SHAs in
# .github/workflows/, and the module versions go.mod pins under go.sum.
#
# The docker entry covers the tag-moved case only. Dependabot's docker
# ecosystem has no security-update channel, and a digest refresh under an
# unchanged tag is not guaranteed, so a republished base may raise no
# pull request at all; docs/architecture/deployment.md §Images and tags
# carries the gap.
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/build"
      - "/deploy/runtime-fixture/meter"
      - "/operator"
      - "/operator/build"
      - "/operator/test/e2e/agent-image"
    schedule:
      interval: "weekly"
  # "/" is where the github-actions ecosystem looks; the workflows under
  # .github/workflows/ are what it reads.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Three modules: go.mod at the root covers cmd/, internal/, tools/ and
  # deploy/runtime-fixture/meter/, api/go.mod the public interfaces
  # (ADR 0032), and operator/go.mod the operator. Per module, one pull request per week for every module
  # bump: separate ones edit adjacent go.mod lines and go.sum, so each
  # merge conflicts the rest.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/api"
      - "/operator"
    schedule:
      interval: "weekly"
    groups:
      go-modules:
        patterns:
          - "*"
